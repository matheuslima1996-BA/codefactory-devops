name: CI - Task Manager API

# Dispara o pipeline a cada push ou pull request nas branches principais
on:
  push:
    branches: [main, desenvolvimento, "features/**"]
  pull_request:
    branches: [main, desenvolvimento]

jobs:
  build-and-test:
    name: Build, Lint e Testes
    runs-on: ubuntu-latest

    steps:
      # 1. Baixa o código do repositório para o runner
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Python na versão utilizada pelo projeto
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Instala as dependências do projeto
      - name: Instalar dependências
        run: pip install -r requirements.txt

      # 4. Garante que o código segue o padrão de estilo definido (PEP8)
      - name: Lint com Flake8
        run: flake8 app/ tests/ --max-line-length=100

      # 5. Executa a suíte de testes automatizados
      - name: Rodar testes automatizados
        run: pytest tests/ -v

      # 6. Constrói a imagem Docker para validar o Dockerfile
      - name: Build da imagem Docker
        run: docker build -t codefactory/task-manager-api:${{ github.sha }} .
