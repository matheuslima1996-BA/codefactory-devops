version: "3.9"

services:
  api:
    build: .
    container_name: codefactory-task-api
    ports:
      - "5000:5000"
    depends_on:
      - db
    environment:
      - FLASK_ENV=production
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: codefactory-task-db
    environment:
      - POSTGRES_USER=codefactory
      - POSTGRES_PASSWORD=codefactory
      - POSTGRES_DB=taskmanager
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data:
